<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SmartCyl — Gas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html">Overview</a>
    <a href="gas.html" class="active">Gas</a>
    <a href="fire.html">Fire</a>
    <a href="weight.html">Weight</a>
  </nav>

  <div class="container">
    <h2>Gas Sensor</h2>

    <div id="statusBanner"></div>

    <div class="card">
      <b>Raw ADC Value:</b> <span id="gasRaw">—</span> / 4095 (Threshold: <span id="threshold">4000</span>)
      <div class="gauge-wrap"><div class="gauge-fill" id="gasGauge" style="width:0%;background:#2ecc71">0%</div></div>
    </div>

    <div class="card">
      <h2>Gas Alert History</h2>
      <ul id="gasHistory"><li>No alerts yet</li></ul>
    </div>
  </div>

  <div class="conn-status">
    <span class="dot dot-red" id="connDot"></span>
    <span id="connText">Connecting...</span>
  </div>

  <script src="smartcyl.js"></script>
  <script>
    const GAS_THRESHOLD = 4000;

    SmartCyl.onUpdate((state) => {
      const r = state.latest;

      document.getElementById('connDot').className = 'dot ' + (state.connected ? 'dot-green' : 'dot-red');
      document.getElementById('connText').textContent = state.connected ? 'Live' : 'Reconnecting...';

      if (r.timestamp === null) return;

      const gasDetected = r.gas > GAS_THRESHOLD;

      document.getElementById('statusBanner').innerHTML = gasDetected
        ? `<div class="alert-red">🚨 GAS LEAK DETECTED!</div>`
        : `<div class="alert-green">✅ Gas level normal</div>`;

      const gasPercent = Math.max(0, Math.min(100, Math.round((r.gas / 4095) * 100)));
      const gasGauge = document.getElementById('gasGauge');
      gasGauge.style.width = gasPercent + '%';
      gasGauge.style.background = gasDetected ? '#e74c3c' : '#2ecc71';
      gasGauge.textContent = gasPercent + '%';
      document.getElementById('gasRaw').textContent = r.gas;

      document.getElementById('gasHistory').innerHTML =
        state.gasHistory.map(e => `<li>${e}</li>`).join('') || '<li>No alerts yet</li>';
    });

    SmartCyl.init();
  </script>
</body>
</html>
