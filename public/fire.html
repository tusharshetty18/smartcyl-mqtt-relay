<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SmartCyl — Fire</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html">Overview</a>
    <a href="gas.html">Gas</a>
    <a href="fire.html" class="active">Fire</a>
    <a href="weight.html">Weight</a>
  </nav>

  <div class="container">
    <h2>Flame Sensor</h2>

    <div id="statusBanner"></div>

    <div class="card">
      <b>Status:</b> <span id="flameStatus">—</span>
    </div>

    <div class="card">
      <h2>Fire Alert History</h2>
      <ul id="flameHistory"><li>No alerts yet</li></ul>
    </div>
  </div>

  <div class="conn-status">
    <span class="dot dot-red" id="connDot"></span>
    <span id="connText">Connecting...</span>
  </div>

  <script src="smartcyl.js"></script>
  <script>
    SmartCyl.onUpdate((state) => {
      const r = state.latest;

      document.getElementById('connDot').className = 'dot ' + (state.connected ? 'dot-green' : 'dot-red');
      document.getElementById('connText').textContent = state.connected ? 'Live' : 'Reconnecting...';

      if (r.timestamp === null) return;

      const flameDetected = !!r.flame;

      document.getElementById('statusBanner').innerHTML = flameDetected
        ? `<div class="alert-red">🔥 FLAME DETECTED!</div>`
        : `<div class="alert-green">✅ No flame detected</div>`;

      document.getElementById('flameStatus').textContent = flameDetected ? 'FLAME' : 'Clear';

      document.getElementById('flameHistory').innerHTML =
        state.flameHistory.map(e => `<li>${e}</li>`).join('') || '<li>No alerts yet</li>';
    });

    SmartCyl.init();
  </script>
</body>
</html>
