<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SmartCyl Monitor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" class="active">Overview</a>
    <a href="gas.html">Gas</a>
    <a href="fire.html">Fire</a>
    <a href="weight.html">Weight</a>
  </nav>

  <div class="container">
    <h2>SmartCyl — Overview</h2>

    <div id="alerts"></div>

    <div class="card">
      <b>Gas Level (Raw ADC):</b> <span id="gasValue">—</span>
      <div class="gauge-wrap"><div class="gauge-fill" id="gasGauge" style="width:0%;background:#2ecc71">0%</div></div>
    </div>

    <div class="card">
      <b>Flame Status:</b> <span id="flameStatus">—</span>
    </div>

    <div class="card">
      <b>Cylinder Weight:</b> <span id="weightValue">—</span> kg
      <div class="gauge-wrap"><div class="gauge-fill" id="weightGauge" style="width:0%;background:#2ecc71">0%</div></div>
    </div>

    <div class="card">
      <b>Cloud Sync (MQTT via relay):</b> <span id="mqttStatus">—</span>
    </div>

    <div class="card">
      <h2>Recent Readings</h2>
      <ul id="weightHistory"></ul>
    </div>
  </div>

  <div class="conn-status">
    <span class="dot dot-red" id="connDot"></span>
    <span id="connText">Connecting...</span>
  </div>

  <script src="smartcyl.js"></script>
  <script>
    const GAS_THRESHOLD = 4000; // matches SmartCyl.ino's #define GAS_THRESHOLD

    SmartCyl.onUpdate((state) => {
      const r = state.latest;

      // Connection dot
      document.getElementById('connDot').className = 'dot ' + (state.connected ? 'dot-green' : 'dot-red');
      document.getElementById('connText').textContent = state.connected ? 'Live' : 'Reconnecting...';

      if (r.timestamp === null) return;

      const gasDetected = r.gas > GAS_THRESHOLD;
      const flameDetected = !!r.flame;
      const lowWeight = r.weight < 1.0 && r.weight > 0;

      // Alert banners
      let alertsHtml = '';
      if (gasDetected) alertsHtml += `<div class="alert-red">🚨 GAS LEAK DETECTED!</div>`;
      if (flameDetected) alertsHtml += `<div class="alert-red">🔥 FLAME DETECTED!</div>`;
      if (lowWeight) alertsHtml += `<div class="alert-yellow">⚠️ LOW GAS CYLINDER — ${r.weight.toFixed(2)} kg remaining</div>`;
      document.getElementById('alerts').innerHTML = alertsHtml;

      // Gas gauge
      const gasPercent = Math.max(0, Math.min(100, Math.round((r.gas / 4095) * 100)));
      const gasGauge = document.getElementById('gasGauge');
      gasGauge.style.width = gasPercent + '%';
      gasGauge.style.background = gasDetected ? '#e74c3c' : '#2ecc71';
      gasGauge.textContent = gasPercent + '%';
      document.getElementById('gasValue').textContent = r.gas;

      // Flame status
      document.getElementById('flameStatus').textContent = flameDetected ? '🔥 FLAME' : '✅ Clear';

      // Weight gauge (assuming 5kg as a full-scale reference, matching original)
      const weightPercent = Math.max(0, Math.min(100, Math.round((r.weight / 5.0) * 100)));
      const weightGauge = document.getElementById('weightGauge');
      weightGauge.style.width = weightPercent + '%';
      weightGauge.style.background = lowWeight ? '#f39c12' : '#2ecc71';
      weightGauge.textContent = weightPercent + '%';
      document.getElementById('weightValue').textContent = r.weight.toFixed(2);

      // MQTT/cloud sync status — if we're receiving live messages at all, the pipeline is up
      document.getElementById('mqttStatus').textContent = state.connected ? '🟢 Connected' : '🔴 Disconnected';

      // Recent readings list
      document.getElementById('weightHistory').innerHTML =
        state.weightHistory.map(e => `<li>${e}</li>`).join('') || '<li>No readings yet</li>';
    });

    SmartCyl.init();
  </script>
</body>
</html>
